name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test-services:
    name: Test Service (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth, profile, files, ml]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: careerlens_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: services/${{ matrix.service }}/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/${{ matrix.service }}/requirements.txt

      - name: Run pytest
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/careerlens_test
          JWT_SECRET: test_super_secret_jwt_key_that_is_at_least_32_bytes_long_careerlens
          JWT_EXPIRE_MINUTES: "60"
          JWT_ALGORITHM: HS256
          REDIS_URL: redis://localhost:6379/0
          DATASET_PATH: ./data/Book2.xlsx
          PYTHONPATH: services/${{ matrix.service }}:services:.
        run: |
          pytest -v services/${{ matrix.service }}/tests

  test-frontend:
    name: Frontend CI (Lint & Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  build-and-push-images:
    name: Docker Build (${{ matrix.target.name }})
    runs-on: ubuntu-latest
    needs: [test-services, test-frontend]
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: auth
            context: ./services/auth
            file: ./services/auth/Dockerfile
          - name: profile
            context: ./services/profile
            file: ./services/profile/Dockerfile
          - name: files
            context: ./services/files
            file: ./services/files/Dockerfile
          - name: ml
            context: ./services/ml
            file: ./services/ml/Dockerfile
          - name: frontend
            context: ./frontend
            file: ./frontend/Dockerfile
          - name: gateway
            context: ./gateway
            file: ./gateway/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine Registry Names & Tags
        id: meta
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "owner_lc=${OWNER_LC}" >> "$GITHUB_OUTPUT"
          echo "repo_lc=${REPO_LC}" >> "$GITHUB_OUTPUT"
          
          if [ "${{ github.ref }}" = "refs/heads/main" ] && [ "${{ github.event_name }}" = "push" ]; then
            echo "should_push=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_push=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GitHub Container Registry
        if: steps.meta.outputs.should_push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and optionally push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.target.context }}
          file: ${{ matrix.target.file }}
          push: ${{ steps.meta.outputs.should_push == 'true' }}
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner_lc }}/careerlens-${{ matrix.target.name }}:${{ github.sha }}
            ghcr.io/${{ steps.meta.outputs.owner_lc }}/careerlens-${{ matrix.target.name }}:latest
            ghcr.io/${{ steps.meta.outputs.repo_lc }}-${{ matrix.target.name }}:${{ github.sha }}
