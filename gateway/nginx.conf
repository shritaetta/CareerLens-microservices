server {
    listen 80;
    server_name localhost;

    # Maximum allowed client request body size (supports large resume/file uploads)
    client_max_body_size 20m;

    # Enable Gzip compression for text and JSON data
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        text/xml
        application/xml
        application/xml+rss
        image/svg+xml;

    # Forward client IP, host, and protocol headers to upstream microservices
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Gateway health check endpoint
    location /gateway-health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"gateway"}\n';
    }

    # Auth Service: /api/auth/ -> http://auth:8000/
    location /api/auth/ {
        proxy_pass http://auth:8000/;
    }

    # Profile Service: /api/profile/ -> http://profile:8000/profile/
    location /api/profile/ {
        proxy_pass http://profile:8000/profile/;
    }

    # Files Service: /api/files/ -> http://files:8000/ (includes /api/files/uploads/... for static files)
    location /api/files/ {
        proxy_pass http://files:8000/;
    }

    # ML Recommendation Service: /api/ml/ -> http://ml:8000/ (with 120s timeout)
    location /api/ml/ {
        proxy_pass http://ml:8000/;
        proxy_read_timeout 120s;
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Frontend Single Page Application: / -> http://frontend:80/
    location / {
        proxy_pass http://frontend:80/;
    }
}
