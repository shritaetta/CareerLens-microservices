apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ml
  labels:
    app.kubernetes.io/part-of: careerlens
    app: ml
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ml
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
