apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  labels:
    app.kubernetes.io/part-of: careerlens
    app: auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
        - name: auth
          image: auth-service:placeholder
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: careerlens-secrets
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: "postgresql+psycopg://postgres:$(POSTGRES_PASSWORD)@postgres:5432/auth_db"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: careerlens-secrets
                  key: JWT_SECRET
            - name: JWT_EXPIRE_MINUTES
              valueFrom:
                configMapKeyRef:
                  name: careerlens-config
                  key: JWT_EXPIRE_MINUTES
            - name: JWT_ALGORITHM
              valueFrom:
                configMapKeyRef:
                  name: careerlens-config
                  key: JWT_ALGORITHM
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
